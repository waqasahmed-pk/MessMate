<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MessMate — Shared Expense Manager</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        /* Hide scrollbar for cleaner UI but allow scrolling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .tab-active { border-bottom: 2px solid #16a34a; color: #16a34a; font-weight: 600; }
        .tab-inactive { color: #64748b; }
        .tab-inactive:hover { color: #0f172a; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- ICONS (Inline SVGs for zero dependencies) ---
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                wallet: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />,
                users: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />,
                plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />,
                trash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
                check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />,
                x: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />,
                list: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />,
                settings: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />,
                edit: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />,
                share: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
            };
            return (
                <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    {icons[name] || icons.check}
                </svg>
            );
        };

        // --- CONSTANTS & DEFAULTS ---
        const DEFAULT_MEMBERS = Array.from({ length: 8 }, (_, i) => ({
            id: `m${i + 1}`,
            name: `Member ${i + 1}`,
        }));
        
        const INITIAL_DEPOSIT = 1000;
        
        const CATEGORIES = ['Vegetables', 'Meat/Chicken', 'Oil/Ghee', 'Roti/Naan', 'Spices', 'Dairy', 'Gas', 'Custom'];
        
        const generateId = () => Math.random().toString(36).substr(2, 9);
        const formatPKR = (num) => `Rs. ${num.toLocaleString('en-PK', { minimumFractionDigits: 0, maximumFractionDigits: 2 })}`;

        // --- MAIN APP COMPONENT ---
        const App = () => {
            // State initialization with LocalStorage
            const [members, setMembers] = useState(() => JSON.parse(localStorage.getItem('mm_members')) || DEFAULT_MEMBERS);
            const [deposits, setDeposits] = useState(() => JSON.parse(localStorage.getItem('mm_deposits')) || DEFAULT_MEMBERS.map(m => ({
                id: generateId(), memberId: m.id, amount: INITIAL_DEPOSIT, date: new Date().toISOString()
            })));
            const [expenses, setExpenses] = useState(() => JSON.parse(localStorage.getItem('mm_expenses')) || []);
            
            const [activeTab, setActiveTab] = useState('dashboard'); // dashboard, log, ledger
            
            // Persist State
            useEffect(() => { localStorage.setItem('mm_members', JSON.stringify(members)); }, [members]);
            useEffect(() => { localStorage.setItem('mm_deposits', JSON.stringify(deposits)); }, [deposits]);
            useEffect(() => { localStorage.setItem('mm_expenses', JSON.stringify(expenses)); }, [expenses]);

            // Math Engine
            const stats = useMemo(() => {
                let totalPool = 0;
                let totalMealSpend = 0;
                let totalGrocerySpend = 0;
                
                // Initialize member stats
                const memberStats = {};
                members.forEach(m => {
                    memberStats[m.id] = { ...m, deposited: 0, mealDeducted: 0, groceryDeducted: 0, mealsAttended: 0 };
                });

                // Calculate Deposits
                deposits.forEach(d => {
                    if(memberStats[d.memberId]) {
                        memberStats[d.memberId].deposited += d.amount;
                        totalPool += d.amount;
                    }
                });

                // Calculate Expenses (The Core Logic)
                expenses.forEach(exp => {
                    let expMealTotal = 0;
                    let expGroceryTotal = 0;
                    
                    exp.items.forEach(item => {
                        const amt = parseFloat(item.amount) || 0;
                        if (item.splitType === 'Meal') expMealTotal += amt;
                        else expGroceryTotal += amt;
                    });

                    totalMealSpend += expMealTotal;
                    totalGrocerySpend += expGroceryTotal;

                    const presentCount = exp.attendance.length;
                    const perHeadMeal = presentCount > 0 ? (expMealTotal / presentCount) : 0;
                    const perHeadGrocery = expGroceryTotal / 8; // Always 8-way split

                    // Distribute Grocery to ALL members
                    members.forEach(m => {
                        memberStats[m.id].groceryDeducted += perHeadGrocery;
                    });

                    // Distribute Meal to PRESENT members
                    exp.attendance.forEach(memberId => {
                        if(memberStats[memberId]) {
                            memberStats[memberId].mealDeducted += perHeadMeal;
                            memberStats[memberId].mealsAttended += 1;
                        }
                    });
                });

                // Calculate Final Balances
                const enrichedMembers = members.map(m => {
                    const st = memberStats[m.id];
                    const balance = st.deposited - (st.mealDeducted + st.groceryDeducted);
                    return { ...st, balance };
                });

                const totalExpense = totalMealSpend + totalGrocerySpend;
                const netRemaining = totalPool - totalExpense;

                return {
                    totalPool, totalMealSpend, totalGrocerySpend, totalExpense, netRemaining,
                    members: enrichedMembers
                };
            }, [members, deposits, expenses]);

            // Global Actions
            const addTopUp = (memberId, amount) => {
                if(!amount || amount <= 0) return;
                setDeposits([...deposits, { id: generateId(), memberId, amount: parseFloat(amount), date: new Date().toISOString() }]);
            };

            const addBulkTopUp = (amount) => {
                if(!amount || amount <= 0) return;
                const newDeps = members.map(m => ({ id: generateId(), memberId: m.id, amount: parseFloat(amount), date: new Date().toISOString() }));
                setDeposits([...deposits, ...newDeps]);
            };

            const updateMemberName = (id, newName) => {
                setMembers(members.map(m => m.id === id ? { ...m, name: newName } : m));
            };

            const saveExpense = (expenseRecord) => {
                setExpenses([expenseRecord, ...expenses]);
                setActiveTab('dashboard');
            };

            const deleteExpense = (id) => {
                if(window.confirm("Are you sure you want to delete this record? Balances will be recalculated.")) {
                    setExpenses(expenses.filter(e => e.id !== id));
                }
            };

            const factoryReset = () => {
                if(window.confirm("WARNING: This will erase all data and reset to default 8 members with 1000 PKR each. Proceed?")) {
                    localStorage.clear();
                    setMembers(DEFAULT_MEMBERS);
                    setDeposits(DEFAULT_MEMBERS.map(m => ({ id: generateId(), memberId: m.id, amount: INITIAL_DEPOSIT, date: new Date().toISOString() })));
                    setExpenses([]);
                    setActiveTab('dashboard');
                }
            };

            return (
                <div className="min-h-screen pb-20 md:pb-0">
                    {/* Top Navigation */}
                    <nav className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                        <div className="max-w-6xl mx-auto px-4">
                            <div className="flex justify-between items-center h-16">
                                <div className="flex items-center space-x-2">
                                    <div className="bg-brand-600 p-2 rounded-lg">
                                        <Icon name="users" className="w-6 h-6 text-white" />
                                    </div>
                                    <span className="font-bold text-xl tracking-tight text-slate-800">MessMate</span>
                                </div>
                                <div className="hidden md:flex space-x-1">
                                    <NavButton active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} icon="wallet">Dashboard</NavButton>
                                    <NavButton active={activeTab === 'log'} onClick={() => setActiveTab('log')} icon="plus">Log Expense</NavButton>
                                    <NavButton active={activeTab === 'ledger'} onClick={() => setActiveTab('ledger')} icon="list">Ledger</NavButton>
                                </div>
                                {/* Mobile settings shortcut */}
                                <button onClick={() => setActiveTab('settings')} className="md:hidden p-2 text-slate-500 hover:bg-slate-100 rounded-full">
                                    <Icon name="settings" />
                                </button>
                            </div>
                        </div>
                    </nav>

                    {/* Mobile Bottom Nav */}
                    <div className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 flex justify-around p-2 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        <MobileNavButton active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} icon="wallet" label="Dash" />
                        <MobileNavButton active={activeTab === 'log'} onClick={() => setActiveTab('log')} icon="plus" label="Log" special />
                        <MobileNavButton active={activeTab === 'ledger'} onClick={() => setActiveTab('ledger')} icon="list" label="Ledger" />
                    </div>

                    {/* Main Content Area */}
                    <main className="max-w-6xl mx-auto px-4 py-6">
                        {activeTab === 'dashboard' && <DashboardView stats={stats} onTopUp={addTopUp} onBulkTopUp={addBulkTopUp} onUpdateName={updateMemberName} />}
                        {activeTab === 'log' && <LogExpenseView members={members} onSave={saveExpense} onCancel={() => setActiveTab('dashboard')} />}
                        {activeTab === 'ledger' && <LedgerView expenses={expenses} members={members} onDelete={deleteExpense} />}
                        {activeTab === 'settings' && <SettingsView onReset={factoryReset} stats={stats} />}
                    </main>

                    {/* Desktop Settings Shortcut */}
                    <button onClick={() => setActiveTab('settings')} className="hidden md:flex fixed bottom-6 right-6 bg-slate-800 text-white p-4 rounded-full shadow-xl hover:bg-slate-700 transition-colors z-50 group items-center">
                        <Icon name="settings" />
                        <span className="max-w-0 overflow-hidden group-hover:max-w-xs transition-all duration-300 ease-in-out whitespace-nowrap pl-0 group-hover:pl-2">Settings & Export</span>
                    </button>
                </div>
            );
        };

        // --- SUB-COMPONENTS ---

        const NavButton = ({ active, onClick, icon, children }) => (
            <button onClick={onClick} className={`flex items-center space-x-2 px-4 py-2 rounded-lg transition-colors font-medium text-sm ${active ? 'bg-brand-50 text-brand-600' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'}`}>
                <Icon name={icon} className="w-4 h-4" />
                <span>{children}</span>
            </button>
        );

        const MobileNavButton = ({ active, onClick, icon, label, special }) => (
            <button onClick={onClick} className={`flex flex-col items-center justify-center w-full py-1 ${special ? '-mt-6' : ''}`}>
                <div className={`p-2 rounded-full flex items-center justify-center ${special ? 'bg-brand-600 text-white shadow-lg shadow-brand-500/30 w-14 h-14' : active ? 'text-brand-600' : 'text-slate-500'}`}>
                    <Icon name={icon} className={special ? 'w-7 h-7' : 'w-6 h-6'} />
                </div>
                {!special && <span className={`text-[10px] mt-1 font-medium ${active ? 'text-brand-600' : 'text-slate-500'}`}>{label}</span>}
            </button>
        );

        // --- DASHBOARD VIEW ---
        const DashboardView = ({ stats, onTopUp, onBulkTopUp, onUpdateName }) => {
            const [topUpModal, setTopUpModal] = useState({ isOpen: false, memberId: null, isBulk: false });

            return (
                <div className="space-y-6">
                    {/* Executive Summary */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <KpiCard title="Total Pool Collected" amount={stats.totalPool} color="blue" />
                        <KpiCard title="Total Expense to Date" amount={stats.totalExpense} subtext={`Meals: ${formatPKR(stats.totalMealSpend)} | Groceries: ${formatPKR(stats.totalGrocerySpend)}`} color="rose" />
                        <KpiCard title="Net Remaining Pool" amount={stats.netRemaining} color="emerald" isHighlight />
                    </div>

                    {/* Header Row */}
                    <div className="flex justify-between items-end mt-8 mb-4 border-b border-slate-200 pb-2">
                        <div>
                            <h2 className="text-xl font-bold text-slate-800">Member Wallets</h2>
                            <p className="text-sm text-slate-500">Manage individual balances and top-ups</p>
                        </div>
                        <button onClick={() => setTopUpModal({ isOpen: true, isBulk: true, memberId: null })} className="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center shadow-sm transition-colors">
                            <Icon name="plus" className="w-4 h-4 mr-2" />
                            Bulk Top-Up (All 8)
                        </button>
                    </div>

                    {/* Member Grid */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        {stats.members.map(member => (
                            <MemberCard 
                                key={member.id} 
                                member={member} 
                                onTopUp={() => setTopUpModal({ isOpen: true, isBulk: false, memberId: member.id })}
                                onUpdateName={(name) => onUpdateName(member.id, name)}
                            />
                        ))}
                    </div>

                    {/* Top Up Modal */}
                    {topUpModal.isOpen && (
                        <TopUpModal 
                            isBulk={topUpModal.isBulk}
                            member={topUpModal.memberId ? stats.members.find(m => m.id === topUpModal.memberId) : null}
                            onClose={() => setTopUpModal({ isOpen: false })}
                            onConfirm={(amount) => {
                                topUpModal.isBulk ? onBulkTopUp(amount) : onTopUp(topUpModal.memberId, amount);
                                setTopUpModal({ isOpen: false });
                            }}
                        />
                    )}
                </div>
            );
        };

        const KpiCard = ({ title, amount, subtext, color, isHighlight }) => {
            const colors = {
                blue: 'bg-blue-50 text-blue-700 border-blue-100',
                rose: 'bg-rose-50 text-rose-700 border-rose-100',
                emerald: 'bg-brand-50 text-brand-700 border-brand-100'
            };
            return (
                <div className={`p-5 rounded-2xl border ${isHighlight ? 'bg-slate-900 text-white border-slate-800 shadow-xl' : 'bg-white border-slate-200 shadow-sm'} flex flex-col justify-between`}>
                    <h3 className={`text-sm font-medium mb-2 ${isHighlight ? 'text-slate-400' : 'text-slate-500'}`}>{title}</h3>
                    <div className={`text-3xl font-bold font-mono tracking-tight ${isHighlight ? 'text-white' : 'text-slate-900'}`}>
                        {formatPKR(amount)}
                    </div>
                    {subtext && <p className={`text-xs mt-2 font-medium ${isHighlight ? 'text-slate-400' : 'text-slate-500'}`}>{subtext}</p>}
                </div>
            );
        };

        const MemberCard = ({ member, onTopUp, onUpdateName }) => {
            const isLowBalance = member.balance < 200 && member.balance >= 0;
            const isNegative = member.balance < 0;
            
            const statusClass = isNegative ? 'border-rose-300 bg-rose-50' : isLowBalance ? 'border-amber-300 bg-amber-50' : 'border-slate-200 bg-white hover:border-slate-300';
            const balClass = isNegative ? 'text-rose-600' : isLowBalance ? 'text-amber-600' : 'text-brand-600';

            return (
                <div className={`rounded-xl border p-4 shadow-sm transition-all flex flex-col ${statusClass}`}>
                    <div className="flex justify-between items-start mb-3">
                        <EditableName initialName={member.name} onSave={onUpdateName} />
                        {(isNegative || isLowBalance) && (
                            <span className={`text-[10px] uppercase font-bold px-2 py-1 rounded-full ${isNegative ? 'bg-rose-200 text-rose-800' : 'bg-amber-200 text-amber-800'}`}>
                                {isNegative ? 'Deficit' : 'Low Bal'}
                            </span>
                        )}
                    </div>
                    
                    <div className="flex-1 space-y-2 mb-4">
                        <div className="flex justify-between text-xs">
                            <span className="text-slate-500">Deposited:</span>
                            <span className="font-mono font-medium text-slate-700">{formatPKR(member.deposited)}</span>
                        </div>
                        <div className="flex justify-between text-xs">
                            <span className="text-slate-500">Meals ({member.mealsAttended}):</span>
                            <span className="font-mono text-slate-600">-{formatPKR(member.mealDeducted)}</span>
                        </div>
                        <div className="flex justify-between text-xs">
                            <span className="text-slate-500">Groceries:</span>
                            <span className="font-mono text-slate-600">-{formatPKR(member.groceryDeducted)}</span>
                        </div>
                    </div>
                    
                    <div className="pt-3 border-t border-slate-200/50 flex items-center justify-between mt-auto">
                        <div className="flex flex-col">
                            <span className="text-[10px] text-slate-400 uppercase font-semibold">Remaining</span>
                            <span className={`text-lg font-bold font-mono ${balClass}`}>{formatPKR(member.balance)}</span>
                        </div>
                        <button onClick={onTopUp} className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-colors shadow-sm">
                            + Top Up
                        </button>
                    </div>
                </div>
            );
        };

        const EditableName = ({ initialName, onSave }) => {
            const [isEditing, setIsEditing] = useState(false);
            const [name, setName] = useState(initialName);
            const inputRef = useRef(null);

            useEffect(() => {
                if(isEditing && inputRef.current) inputRef.current.focus();
            }, [isEditing]);

            const handleSave = () => {
                if(name.trim() !== '') onSave(name.trim());
                else setName(initialName);
                setIsEditing(false);
            };

            if(isEditing) {
                return (
                    <input 
                        ref={inputRef}
                        type="text" 
                        value={name} 
                        onChange={e => setName(e.target.value)}
                        onBlur={handleSave}
                        onKeyDown={e => e.key === 'Enter' && handleSave()}
                        className="text-sm font-bold text-slate-800 bg-white border border-brand-500 rounded px-1 w-2/3 outline-none"
                    />
                );
            }
            return (
                <div onClick={() => setIsEditing(true)} className="text-sm font-bold text-slate-800 cursor-pointer hover:text-brand-600 border-b border-transparent hover:border-brand-300 flex items-center group">
                    {initialName}
                    <Icon name="edit" className="w-3 h-3 ml-1 opacity-0 group-hover:opacity-100 text-slate-400" />
                </div>
            );
        };

        const TopUpModal = ({ isBulk, member, onClose, onConfirm }) => {
            const [amount, setAmount] = useState('');
            const title = isBulk ? "Bulk Top-Up (All 8 Members)" : `Top-Up ${member?.name}`;
            const desc = isBulk ? "Enter amount to add to EVERY member's wallet." : "Enter amount to add to this specific wallet.";

            return (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl animate-fade-in-up">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-lg font-bold text-slate-800">{title}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-700"><Icon name="x" /></button>
                        </div>
                        <p className="text-sm text-slate-500 mb-6">{desc}</p>
                        
                        <div className="mb-6 relative">
                            <span className="absolute left-3 top-3 text-slate-400 font-medium">Rs.</span>
                            <input 
                                type="number" 
                                value={amount}
                                onChange={(e) => setAmount(e.target.value)}
                                placeholder="1000"
                                className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-lg font-mono font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500"
                                autoFocus
                            />
                        </div>

                        <div className="flex space-x-3">
                            <button onClick={onClose} className="flex-1 py-3 bg-slate-100 text-slate-700 font-medium rounded-xl hover:bg-slate-200 transition-colors">Cancel</button>
                            <button 
                                onClick={() => onConfirm(amount)} 
                                disabled={!amount || isNaN(amount) || amount <= 0}
                                className="flex-1 py-3 bg-brand-600 text-white font-medium rounded-xl hover:bg-brand-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors shadow-lg shadow-brand-500/30"
                            >
                                Confirm
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- LOG EXPENSE VIEW ---
        const LogExpenseView = ({ members, onSave, onCancel }) => {
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [isMultiMeal, setIsMultiMeal] = useState(false);
            const [mealType, setMealType] = useState('Dinner'); // Breakfast, Lunch, Dinner
            const [attendance, setAttendance] = useState(members.map(m => m.id)); // Default all present
            
            const [items, setItems] = useState([
                { id: generateId(), name: '', amount: '', category: 'Vegetables', splitType: 'Meal' }
            ]);

            const toggleAttendance = (id) => {
                setAttendance(prev => prev.includes(id) ? prev.filter(m => m !== id) : [...prev, id]);
            };

            const addItem = () => {
                setItems([...items, { id: generateId(), name: '', amount: '', category: 'Custom', splitType: 'Meal' }]);
            };

            const updateItem = (id, field, value) => {
                setItems(items.map(item => item.id === id ? { ...item, [field]: value } : item));
            };

            const removeItem = (id) => {
                if(items.length > 1) setItems(items.filter(item => item.id !== id));
            };

            // Calculation Preview
            const preview = useMemo(() => {
                let mealTotal = 0;
                let groceryTotal = 0;
                items.forEach(item => {
                    const amt = parseFloat(item.amount) || 0;
                    if(item.splitType === 'Meal') mealTotal += amt;
                    else groceryTotal += amt;
                });
                
                const presentCount = attendance.length;
                const perPresentMeal = presentCount > 0 ? mealTotal / presentCount : 0;
                const perMemberGrocery = groceryTotal / 8;
                const billTotal = mealTotal + groceryTotal;

                return { mealTotal, groceryTotal, billTotal, presentCount, perPresentMeal, perMemberGrocery };
            }, [items, attendance]);

            const handleSave = () => {
                // Validation
                if(items.some(i => !i.amount || isNaN(i.amount) || i.amount <= 0)) {
                    alert("Please enter valid amounts for all items."); return;
                }
                if(preview.mealTotal > 0 && preview.presentCount === 0) {
                    alert("Cannot log Meal expenses with 0 members present."); return;
                }

                const record = {
                    id: generateId(),
                    timestamp: new Date().toISOString(),
                    date,
                    mealType: isMultiMeal ? mealType : 'Dinner',
                    attendance,
                    items: items.map(i => ({...i, amount: parseFloat(i.amount)})),
                    calcSnapshot: preview
                };
                onSave(record);
            };

            return (
                <div className="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="p-6 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
                        <h2 className="text-xl font-bold text-slate-800">Log Daily Expense</h2>
                        <button onClick={onCancel} className="text-slate-400 hover:text-slate-600"><Icon name="x" /></button>
                    </div>

                    <div className="p-6 space-y-8">
                        {/* Meta Settings */}
                        <div className="flex flex-col md:flex-row gap-4">
                            <div className="flex-1">
                                <label className="block text-xs font-semibold text-slate-500 uppercase mb-2">Date</label>
                                <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm font-medium focus:ring-2 focus:ring-brand-500 outline-none" />
                            </div>
                            <div className="flex-1">
                                <div className="flex justify-between items-end mb-2">
                                    <label className="block text-xs font-semibold text-slate-500 uppercase">Meal Type</label>
                                    <label className="flex items-center space-x-2 cursor-pointer">
                                        <span className="text-[10px] font-bold text-slate-400 uppercase">Multi-Meal</span>
                                        <div className={`w-8 h-4 rounded-full relative transition-colors ${isMultiMeal ? 'bg-brand-500' : 'bg-slate-300'}`} onClick={() => setIsMultiMeal(!isMultiMeal)}>
                                            <div className={`absolute top-0.5 left-0.5 bg-white w-3 h-3 rounded-full transition-transform ${isMultiMeal ? 'translate-x-4' : ''}`}></div>
                                        </div>
                                    </label>
                                </div>
                                {isMultiMeal ? (
                                    <select value={mealType} onChange={e => setMealType(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-sm font-medium outline-none">
                                        <option>Breakfast</option><option>Lunch</option><option>Dinner</option>
                                    </select>
                                ) : (
                                    <div className="w-full bg-slate-100 border border-slate-200 rounded-lg p-2.5 text-sm font-medium text-slate-500 text-center">Dinner (Default)</div>
                                )}
                            </div>
                        </div>

                        {/* Attendance Roster */}
                        <div>
                            <div className="flex justify-between items-center mb-3">
                                <label className="block text-xs font-semibold text-slate-500 uppercase">Attendance (Meal Split)</label>
                                <span className="text-xs font-bold text-brand-600 bg-brand-50 px-2 py-1 rounded-full">{attendance.length}/8 Present</span>
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                                {members.map(m => {
                                    const isPresent = attendance.includes(m.id);
                                    return (
                                        <button 
                                            key={m.id} 
                                            onClick={() => toggleAttendance(m.id)}
                                            className={`p-2 rounded-lg border text-sm font-medium transition-all flex items-center justify-between ${isPresent ? 'bg-brand-50 border-brand-200 text-brand-700' : 'bg-slate-50 border-slate-200 text-slate-400'}`}
                                        >
                                            <span className="truncate pr-2">{m.name}</span>
                                            <div className={`w-3 h-3 rounded-full flex-shrink-0 ${isPresent ? 'bg-brand-500' : 'bg-slate-300'}`}></div>
                                        </button>
                                    );
                                })}
                            </div>
                            <p className="text-[10px] text-slate-400 mt-2 italic">*Members marked absent pay 0 PKR for Meals, but still split Groceries equally.</p>
                        </div>

                        {/* Item Builder */}
                        <div>
                            <label className="block text-xs font-semibold text-slate-500 uppercase mb-3">Purchased Items</label>
                            <div className="space-y-3">
                                {items.map((item, index) => (
                                    <div key={item.id} className="flex flex-col md:flex-row gap-2 items-start md:items-center bg-slate-50 p-3 rounded-xl border border-slate-200">
                                        
                                        {/* Split Type Toggle */}
                                        <div className="flex bg-slate-200 rounded-lg p-1 w-full md:w-auto flex-shrink-0">
                                            <button 
                                                onClick={() => updateItem(item.id, 'splitType', 'Meal')}
                                                className={`flex-1 md:flex-none px-3 py-1.5 text-xs font-bold rounded-md transition-all ${item.splitType === 'Meal' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                            >Meal</button>
                                            <button 
                                                onClick={() => updateItem(item.id, 'splitType', 'Grocery')}
                                                className={`flex-1 md:flex-none px-3 py-1.5 text-xs font-bold rounded-md transition-all ${item.splitType === 'Grocery' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                            >Grocery</button>
                                        </div>

                                        <select 
                                            value={item.category} 
                                            onChange={e => updateItem(item.id, 'category', e.target.value)}
                                            className="w-full md:w-32 bg-white border border-slate-200 rounded-lg p-2 text-sm outline-none"
                                        >
                                            {CATEGORIES.map(c => <option key={c}>{c}</option>)}
                                        </select>

                                        <input 
                                            type="text" 
                                            placeholder="Item detail/note" 
                                            value={item.name}
                                            onChange={e => updateItem(item.id, 'name', e.target.value)}
                                            className="w-full bg-white border border-slate-200 rounded-lg p-2 text-sm outline-none"
                                        />

                                        <div className="relative w-full md:w-32 flex-shrink-0">
                                            <span className="absolute left-2 top-2 text-xs font-mono text-slate-400">Rs.</span>
                                            <input 
                                                type="number" 
                                                placeholder="0" 
                                                value={item.amount}
                                                onChange={e => updateItem(item.id, 'amount', e.target.value)}
                                                className="w-full bg-white border border-slate-200 rounded-lg p-2 pl-8 text-sm font-mono font-bold text-slate-900 outline-none"
                                            />
                                        </div>

                                        <button onClick={() => removeItem(item.id)} className="text-slate-400 hover:text-rose-500 p-2 ml-auto md:ml-0"><Icon name="trash" className="w-4 h-4" /></button>
                                    </div>
                                ))}
                            </div>
                            <button onClick={addItem} className="mt-3 text-sm font-bold text-brand-600 hover:text-brand-700 flex items-center">
                                <Icon name="plus" className="w-4 h-4 mr-1" /> Add Row
                            </button>
                        </div>
                    </div>

                    {/* Live Preview Panel */}
                    <div className="bg-slate-900 p-6 text-white border-t border-slate-800">
                        <div className="flex flex-col md:flex-row justify-between items-center gap-6">
                            <div className="w-full md:w-2/3 space-y-3">
                                <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Live Calculation Preview</h4>
                                <div className="flex justify-between items-center text-sm">
                                    <span className="text-slate-300">Meal (Present Only)</span>
                                    <span className="font-mono">{formatPKR(preview.mealTotal)} ÷ {preview.presentCount} = <span className="text-brand-400 font-bold">{formatPKR(preview.perPresentMeal)}/head</span></span>
                                </div>
                                <div className="flex justify-between items-center text-sm">
                                    <span className="text-slate-300">Grocery (All 8)</span>
                                    <span className="font-mono">{formatPKR(preview.groceryTotal)} ÷ 8 = <span className="text-blue-400 font-bold">{formatPKR(preview.perMemberGrocery)}/head</span></span>
                                </div>
                                <div className="h-px w-full bg-slate-700 my-2"></div>
                                <div className="flex justify-between items-center text-xs">
                                    <span className="text-slate-400">Present members pay: <strong className="text-white ml-1 font-mono">{formatPKR(preview.perPresentMeal + preview.perMemberGrocery)}</strong></span>
                                    <span className="text-slate-400">Absent pay: <strong className="text-white ml-1 font-mono">{formatPKR(preview.perMemberGrocery)}</strong></span>
                                </div>
                            </div>
                            
                            <div className="w-full md:w-1/3 flex flex-col gap-3">
                                <div className="text-center md:text-right">
                                    <div className="text-[10px] text-slate-400 uppercase font-bold">Total Bill</div>
                                    <div className="text-3xl font-mono font-bold text-white">{formatPKR(preview.billTotal)}</div>
                                </div>
                                <button onClick={handleSave} className="w-full bg-brand-500 hover:bg-brand-600 text-white font-bold py-3 rounded-xl shadow-lg transition-colors flex justify-center items-center">
                                    <Icon name="check" className="w-5 h-5 mr-2" /> Save Record
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- LEDGER VIEW ---
        const LedgerView = ({ expenses, members, onDelete }) => {
            const memberMap = useMemo(() => {
                const map = {};
                members.forEach(m => map[m.id] = m.name);
                return map;
            }, [members]);

            const generateWhatsAppText = (exp) => {
                const dateStr = new Date(exp.date).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                
                let text = `*MessMate Bill Summary*\n📅 ${dateStr} | 🍽️ ${exp.mealType}\n\n`;
                
                text += `*Items:*\n`;
                exp.items.forEach(i => {
                    const icon = i.splitType === 'Meal' ? '🍛' : '🛒';
                    const note = i.name ? ` (${i.name})` : '';
                    text += `${icon} ${i.category}${note}: Rs.${i.amount}\n`;
                });
                
                text += `\n*Calculation:*\n`;
                text += `Total Meal: Rs.${exp.calcSnapshot.mealTotal} (÷ ${exp.calcSnapshot.presentCount} present) = Rs.${Math.round(exp.calcSnapshot.perPresentMeal)}/head\n`;
                text += `Total Grocery: Rs.${exp.calcSnapshot.groceryTotal} (÷ 8 all) = Rs.${Math.round(exp.calcSnapshot.perMemberGrocery)}/head\n`;
                text += `Total Bill: *Rs.${exp.calcSnapshot.billTotal}*\n\n`;
                
                text += `*Per Person Charge:*\n`;
                text += `Present members pay: *Rs.${Math.round(exp.calcSnapshot.perPresentMeal + exp.calcSnapshot.perMemberGrocery)}*\n`;
                text += `Absent members pay: *Rs.${Math.round(exp.calcSnapshot.perMemberGrocery)}*\n\n`;
                
                const absentees = members.filter(m => !exp.attendance.includes(m.id)).map(m => m.name);
                if (absentees.length > 0) {
                    text += `*Absentees:* ${absentees.join(', ')}\n`;
                }

                text += `\n_Generated by MessMate_`;
                
                // Copy to clipboard
                const textarea = document.createElement("textarea");
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    alert("Summary copied to clipboard! Ready to paste in WhatsApp.");
                } catch (err) {
                    alert("Failed to copy text.");
                }
                document.body.removeChild(textarea);
            };

            if (expenses.length === 0) {
                return (
                    <div className="text-center py-20">
                        <div className="bg-slate-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400">
                            <Icon name="list" className="w-8 h-8" />
                        </div>
                        <h3 className="text-lg font-bold text-slate-700">No records yet</h3>
                        <p className="text-slate-500 text-sm mt-1">Go to Log Expense to add your first bill.</p>
                    </div>
                );
            }

            return (
                <div className="space-y-4">
                    <h2 className="text-xl font-bold text-slate-800 mb-6">Expense Ledger</h2>
                    {expenses.map(exp => (
                        <div key={exp.id} className="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                            {/* Header */}
                            <div className="bg-slate-50 p-4 border-b border-slate-200 flex flex-wrap justify-between items-center gap-4">
                                <div className="flex items-center space-x-3">
                                    <div className="bg-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded-lg uppercase tracking-wider">
                                        {new Date(exp.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}
                                    </div>
                                    <div className="font-bold text-slate-700">{exp.mealType}</div>
                                </div>
                                <div className="flex items-center space-x-4">
                                    <div className="text-right">
                                        <div className="text-[10px] text-slate-500 uppercase font-semibold">Total Bill</div>
                                        <div className="text-lg font-bold font-mono text-slate-900">{formatPKR(exp.calcSnapshot.billTotal)}</div>
                                    </div>
                                    <div className="flex space-x-2">
                                        <button onClick={() => generateWhatsAppText(exp)} className="p-2 text-brand-600 hover:bg-brand-50 rounded-lg transition-colors" title="Copy for WhatsApp">
                                            <Icon name="share" />
                                        </button>
                                        <button onClick={() => onDelete(exp.id)} className="p-2 text-rose-500 hover:bg-rose-50 rounded-lg transition-colors" title="Delete Record">
                                            <Icon name="trash" />
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            {/* Details */}
                            <div className="p-4 grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <h4 className="text-xs font-bold text-slate-400 uppercase mb-3">Itemized Bill</h4>
                                    <div className="space-y-2">
                                        {exp.items.map((item, idx) => (
                                            <div key={idx} className="flex justify-between items-center text-sm border-b border-slate-100 pb-2">
                                                <div className="flex items-center">
                                                    <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded mr-2 ${item.splitType === 'Meal' ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}`}>
                                                        {item.splitType}
                                                    </span>
                                                    <span className="text-slate-700">{item.category} {item.name && <span className="text-slate-400 text-xs">({item.name})</span>}</span>
                                                </div>
                                                <span className="font-mono font-medium">{formatPKR(item.amount)}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-slate-50 rounded-xl p-4 border border-slate-100">
                                    <h4 className="text-xs font-bold text-slate-400 uppercase mb-3">Split Logic</h4>
                                    <div className="space-y-3">
                                        <div className="flex justify-between text-sm">
                                            <span className="text-slate-600">Present (<span className="font-bold text-brand-600">{exp.calcSnapshot.presentCount}</span>) pay:</span>
                                            <span className="font-mono font-bold">{formatPKR(exp.calcSnapshot.perPresentMeal + exp.calcSnapshot.perMemberGrocery)}</span>
                                        </div>
                                        <div className="flex justify-between text-sm">
                                            <span className="text-slate-600">Absent (<span className="font-bold text-rose-500">{8 - exp.calcSnapshot.presentCount}</span>) pay:</span>
                                            <span className="font-mono font-bold">{formatPKR(exp.calcSnapshot.perMemberGrocery)}</span>
                                        </div>
                                        <div className="pt-2 mt-2 border-t border-slate-200">
                                            <p className="text-[10px] text-slate-500 mb-1 font-semibold uppercase">Absent Members:</p>
                                            <div className="flex flex-wrap gap-1">
                                                {members.filter(m => !exp.attendance.includes(m.id)).map(m => (
                                                    <span key={m.id} className="text-[10px] bg-white border border-rose-200 text-rose-600 px-1.5 py-0.5 rounded">
                                                        {m.name}
                                                    </span>
                                                ))}
                                                {members.filter(m => !exp.attendance.includes(m.id)).length === 0 && <span className="text-[10px] text-slate-400 italic">None (All present)</span>}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        // --- SETTINGS VIEW ---
        const SettingsView = ({ onReset, stats }) => {
            const handleExport = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(localStorage));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href",     dataStr);
                downloadAnchorNode.setAttribute("download", "messmate_backup_" + new Date().getTime() + ".json");
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
            };

            const copyStatusText = () => {
                let text = `*MessMate Status Update*\nTotal Pool: Rs.${stats.totalPool}\nNet Remaining: Rs.${stats.netRemaining}\n\n*Member Balances:*\n`;
                stats.members.forEach(m => {
                    const flag = m.balance < 0 ? '🔴' : m.balance < 200 ? '🟡' : '🟢';
                    text += `${flag} ${m.name}: Rs.${Math.round(m.balance)}\n`;
                });
                
                const textarea = document.createElement("textarea");
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    alert("Status Summary copied to clipboard!");
                } catch (err) {}
                document.body.removeChild(textarea);
            };

            return (
                <div className="max-w-2xl mx-auto space-y-6">
                    <h2 className="text-xl font-bold text-slate-800">Settings & Export</h2>
                    
                    <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
                        <h3 className="text-sm font-bold text-slate-800 mb-4 uppercase tracking-wider">Data Management</h3>
                        
                        <div className="space-y-4">
                            <button onClick={copyStatusText} className="w-full flex items-center justify-between p-4 rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50 transition-colors group">
                                <div className="text-left">
                                    <div className="font-bold text-slate-800 group-hover:text-brand-700">Copy Current Balances</div>
                                    <div className="text-xs text-slate-500 mt-1">Generates a quick text summary of everyone's remaining wallet balance for WhatsApp.</div>
                                </div>
                                <Icon name="share" className="text-slate-400 group-hover:text-brand-600" />
                            </button>

                            <button onClick={handleExport} className="w-full flex items-center justify-between p-4 rounded-xl border border-slate-200 hover:border-blue-500 hover:bg-blue-50 transition-colors group">
                                <div className="text-left">
                                    <div className="font-bold text-slate-800 group-hover:text-blue-700">Export Backup (JSON)</div>
                                    <div className="text-xs text-slate-500 mt-1">Download raw application data (members, deposits, logs) for backup.</div>
                                </div>
                                <Icon name="list" className="text-slate-400 group-hover:text-blue-600" />
                            </button>

                            <div className="pt-6 mt-6 border-t border-rose-100">
                                <button onClick={onReset} className="w-full flex items-center justify-between p-4 rounded-xl bg-rose-50 border border-rose-200 hover:bg-rose-600 hover:text-white transition-colors group text-rose-600">
                                    <div className="text-left">
                                        <div className="font-bold">Factory Reset Data</div>
                                        <div className="text-xs opacity-80 mt-1">Delete ALL history, reset names, and set balances back to 1000 PKR. Cannot be undone.</div>
                                    </div>
                                    <Icon name="trash" />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
